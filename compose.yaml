services:
  a-to-zero:
    build: .
    container_name: a-to-zero
    ports:
      - "8080:8080"
    environment:
      # The real store to mirror. Swap for another and rebuild, e.g.
      #   https://www.walmart.com  |  https://www.target.com  |  https://www.newegg.com
      TARGET: "https://www.amazon.com"
    restart: unless-stopped
